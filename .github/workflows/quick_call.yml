name: Quick Call Report

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "Report day YYYY-MM-DD (empty = yesterday KSA)"
        required: false
        default: ""
      send_email:
        description: "Send the email"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Riyadh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests pytz playwright Pillow fpdf2
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-core fonts-noto-ui-core

      - name: Run report
        env:
          ZENPUT_API_TOKEN: ${{ secrets.ZENPUT_API_TOKEN }}
          SENDER_EMAIL: aof.group.auto@gmail.com
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          REPORT_DATE: ${{ github.event.inputs.report_date }}
          SEND_EMAIL: ${{ github.event.inputs.send_email || 'true' }}
        run: python quick_call_report.py

      - name: Upload PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-call-report
          path: |
            quick_call_report_*.pdf
            quick_call_report.html
          if-no-files-found: ignore
